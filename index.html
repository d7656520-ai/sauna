<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Сауны Португалии</title>
<meta name="description" content="Где попариться у Кашкайша, Оэйраша, Синтры и в Лиссабоне: карта, цены, длительность сеанса, бронь.">
<meta property="og:title" content="Сауны Португалии">
<meta property="og:description" content="Сауны, бани и спа вокруг Лиссабона и по Португалии: карта, цены разового входа и абонементов, бронь, фото.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://d7656520-ai.github.io/sauna/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<style>
/* Layout: split screen. Left: header, filters, sortable table. Right: sticky map. Phone: header, map, filters (collapsible), compact rows. */
:root{
  --bg:#f4f6f5; --panel:#ffffff; --ink:#18201d; --muted:#5d6a65; --line:#dde3e0;
  --sea:#0f6b72; --sea-soft:#e2f0f0; --heat:#c26a12; --heat-soft:#fbefdf;
  --ok:#2f7d4f; --ok-soft:#e3f2e8; --warn:#9a6a00; --warn-soft:#fbf1d6; --no:#a23a3a; --no-soft:#f7e3e3;
  --chip:#eef2f0; --scrim:rgba(8,14,12,.92); --tilefilter:none;
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1513; --panel:#161e1b; --ink:#e6ece9; --muted:#97a6a0; --line:#26322e;
  --sea:#5cc0c6; --sea-soft:#15302f; --heat:#f0a24a; --heat-soft:#3a2810;
  --ok:#6fcf93; --ok-soft:#173326; --warn:#e5bf55; --warn-soft:#3a3010; --no:#ef8a8a; --no-soft:#3d1c1c;
  --chip:#1d2723; --scrim:rgba(0,0,0,.94);
  --tilefilter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.6);
  color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
html{overscroll-behavior-y:none}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--sea)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(0,58fr) minmax(360px,42fr);grid-template-rows:auto 1fr;min-height:100%}
.hd{grid-column:1;grid-row:1;min-width:0;padding-block:20px 0;padding-left:max(20px,env(safe-area-inset-left));padding-right:20px}
.main{grid-column:1;grid-row:2;min-width:0;padding-block:0 40px;padding-left:max(20px,env(safe-area-inset-left));padding-right:20px}
.mapwrap{grid-column:2;grid-row:1 / span 2;align-self:start;position:sticky;top:0;height:100vh;border-left:1px solid var(--line)}
#map{position:absolute;inset:0;background:var(--chip)}
.leaflet-tile-pane{filter:var(--tilefilter)}
.hd h1{font:700 clamp(22px,3vw,30px)/1.1 var(--f-display);letter-spacing:-.01em;margin:0 0 6px;text-wrap:balance}
.hd p{margin:0;color:var(--muted);max-width:66ch}
.stats{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0 2px;color:var(--muted);font-size:13px}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.filters{display:grid;gap:10px;margin:16px 0;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.frow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.flabel{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:84px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;white-space:nowrap;line-height:1.2}
.chip[aria-pressed="true"],.chip[aria-expanded="true"]{background:var(--sea);border-color:var(--sea);color:var(--panel)}
.chip:hover{border-color:var(--sea)}
.search{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 11px}
.range{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.range input{width:130px;accent-color:var(--sea)}
.range output{color:var(--ink);font-variant-numeric:tabular-nums;min-width:48px}
select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 8px;font-size:13px}
.reset{background:none;border:none;color:var(--sea);cursor:pointer;font-size:13px;padding:4px 2px;text-decoration:underline}
.ftoggle,.maptoggle{display:none}
.hint{font-size:12.5px;color:var(--muted);margin:0 0 8px}
.warn-i{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--warn-soft);color:var(--warn);font-size:11px;font-weight:700;vertical-align:1px;margin-left:4px}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{position:sticky;top:0;z-index:1;background:var(--panel);text-align:left;font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
th button{all:unset;cursor:pointer;display:block;padding:10px 9px}
th button:focus-visible{outline:2px solid var(--sea)}
th[aria-sort] button::after{content:"";display:inline-block;margin-left:4px;border:4px solid transparent;vertical-align:1px}
th[aria-sort="ascending"] button::after{border-bottom-color:currentColor;border-top-width:0}
th[aria-sort="descending"] button::after{border-top-color:currentColor;border-bottom-width:0}
th[aria-sort] {color:var(--ink)}
th.nosort{padding:10px 9px}
td{padding:9px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover td,tr.row.active td{background:var(--sea-soft)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.name{font-weight:600}
@media (min-width:901px) and (max-width:2099px){.hide-l{display:none!important} .m-in{display:inline!important}}
@media (min-width:901px){#tbody > tr > td:nth-child(2){min-width:180px} table{font-size:13.5px} td{padding:8px 7px} th button,th.nosort{padding:9px 7px}}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.am{font-size:12.5px;color:var(--heat);margin-top:4px;line-height:1.35}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:11.5px;padding:1px 7px;border-radius:6px;background:var(--chip);color:var(--muted);white-space:nowrap}
.tag.heat{background:var(--heat-soft);color:var(--heat)}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;white-space:nowrap;font-weight:500}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-no{background:var(--no-soft);color:var(--no)}.p-na{background:var(--chip);color:var(--muted)}
.kind{display:inline-flex;align-items:center;font-size:12.5px;white-space:nowrap}
.price{font-weight:600}
.dim{color:var(--muted)}
.hrs{font-size:12.5px;color:var(--muted);min-width:118px;max-width:140px}
.thumbs{display:flex;gap:3px;width:max-content}
.thumbs button{all:unset;cursor:zoom-in;display:block;border-radius:7px;overflow:hidden;background:var(--chip);width:58px;height:44px}
.thumbs button + button{display:none}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.nophoto{width:58px;height:44px;border-radius:7px;background:var(--chip);display:grid;place-items:center;color:var(--muted);font-size:11px;text-align:center;line-height:1.1}
tr.detail td{background:var(--bg);padding:10px 12px 12px}
.gallery{display:flex;gap:5px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.gallery button{all:unset;cursor:zoom-in;flex:0 0 auto;width:120px;height:84px;border-radius:8px;overflow:hidden;background:var(--chip)}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px 18px;font-size:13px;line-height:1.4;margin:0}
.dgrid dt{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:1px}
.dgrid dd{margin:0;overflow-wrap:anywhere}
.note{margin:8px 0 0;font-size:13px;max-width:80ch}
.src{margin-top:6px;font-size:11.5px;color:var(--muted)}
.src a{color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.foot{margin-top:18px;font-size:12.5px;color:var(--muted);max-width:78ch}
.show-m{display:none}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.langsw{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:0 0 auto;margin-top:4px}
.langsw button{all:unset;cursor:pointer;font-size:12px;font-weight:600;padding:5px 10px;color:var(--muted)}
.langsw button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.os{font-size:12.5px;font-weight:600;line-height:1.3}
.os.o{color:var(--ok)} .os.c{color:var(--muted)}
.wk{display:inline-flex;gap:2px;margin-top:4px}
.wk i{font-style:normal;font-size:11px;width:15px;height:17px;display:grid;place-items:center;border-radius:4px;background:var(--chip);color:var(--muted);font-weight:600}
.wk i.on{background:var(--ok-soft);color:var(--ok)} .wk i.off{background:transparent;color:var(--line)} .wk i.td{outline:1.5px solid var(--ink);outline-offset:-1.5px}
.wkt{border-collapse:collapse;font-size:13px;width:auto;margin-top:2px} tr.detail .wkt td,.wkt td{padding:1px 14px 1px 0;border:0;background:none!important;line-height:1.45} .wkt tr.td td{font-weight:700}
.rbs{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.rb{display:inline-flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap}
.rb b{display:inline-grid;place-items:center;min-width:30px;height:22px;padding:0 5px;border-radius:6px 6px 6px 0;color:#fff;font-size:12.5px;font-variant-numeric:tabular-nums}
.rb.g1 b{background:#1e7d4a}.rb.g2 b{background:#4b8f63}.rb.g3 b{background:#7d8a84}
.rb.bk b{background:#003580}
.rb .st{color:#e7a300;font-size:13px;margin-left:-2px}
.rb .rc{color:var(--muted);font-variant-numeric:tabular-nums}
.bookb,.bookb:visited{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;color:#fff!important;background:var(--sea);border-radius:999px;padding:3px 10px;text-decoration:none;white-space:nowrap}
.bookb:hover{filter:brightness(1.08)}
.leaflet-container a.bookb,.leaflet-container a.bookb:visited{color:#fff}
.leaflet-popup-content .bookb{margin-top:0}
a.act.prim,a.act.prim:visited{background:var(--sea);border-color:var(--sea);color:#fff;font-weight:600}
.fab{display:none}
.mapfull-x{display:none}
html.mapfull{overflow:hidden}
html.mapfull .mapwrap{position:fixed!important;inset:0;height:100%!important;z-index:1500;border:none}
html.mapfull .mapfull-x{all:unset;display:block;position:absolute;z-index:1600;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));cursor:pointer;background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.act{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--ink);text-decoration:none}
a.act{color:var(--ink)}
.act:hover{border-color:var(--sea)}
.near{all:unset;cursor:pointer;color:var(--sea);font-size:13px;text-decoration:underline;padding:4px 2px}
.m-in{display:none}
/* map */
.leaflet-container{font:inherit}
.mk{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);display:grid;place-items:center}
.mk span{transform:rotate(45deg);font-size:11px;font-weight:700;color:#fff}
.mk.active{outline:3px solid var(--heat)}
.mcl{width:34px;height:34px;border-radius:50%;background:var(--sea);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.leaflet-popup-content-wrapper{border-radius:12px;background:var(--panel);color:var(--ink)}
.leaflet-popup-tip{background:var(--panel)}
.leaflet-popup-content{margin:0;width:312px!important;max-width:calc(100vw - 40px);font-size:13.5px;line-height:1.38}
.pp-sw{position:relative;border-radius:12px 12px 0 0;overflow:hidden;background:var(--chip)}
.pp-sl{display:flex;height:175px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;touch-action:pan-x}
.pp-sl::-webkit-scrollbar{display:none}
.pp-sl button{all:unset;cursor:zoom-in;flex:0 0 100%;scroll-snap-align:center;height:100%}
.pp-sl img{width:100%;height:100%;object-fit:cover;display:block}
.pp-nav{all:unset;cursor:pointer;position:absolute;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;font-size:17px;line-height:1}
.pp-nav.l{left:6px}.pp-nav.r{right:6px}
.pp-cnt{position:absolute;right:8px;bottom:7px;background:rgba(0,0,0,.5);color:#fff;font-size:11px;padding:1px 7px;border-radius:999px}
.pp-b{padding:10px 12px 12px}
.pp-b b.t{font-size:14px;display:block}
.pp-grid{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin-top:8px}
.pp-grid span:nth-child(odd){color:var(--muted)}
.pp-more{all:unset;cursor:pointer;color:var(--sea);margin-top:8px;display:inline-block;text-decoration:underline}
.leaflet-container a.leaflet-popup-close-button{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);font-size:20px;width:26px;height:26px}
/* lightbox */
.lb{position:fixed;inset:0;z-index:2000;background:var(--scrim);display:grid;grid-template-rows:auto 1fr auto;color:#fff;touch-action:pan-y}
.lb-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));font-size:14px}
.lb-top b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-x{all:unset;cursor:pointer;font-size:28px;line-height:1;padding:4px 8px}
.lb-stage{position:relative;min-height:0;display:grid;place-items:center;overflow:hidden}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.lb-nav{all:unset;cursor:pointer;position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:22px}
.lb-nav:hover{background:rgba(255,255,255,.26)}
.lb-prev{left:max(10px,env(safe-area-inset-left,0px))}.lb-next{right:max(10px,env(safe-area-inset-right,0px))}
.lb-bot{display:flex;justify-content:space-between;gap:12px;padding:10px max(14px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));font-size:13px;color:rgba(255,255,255,.75)}
.lb-bot a{color:rgba(255,255,255,.85)}
@media (max-width:900px){
  .app{display:block}
  .hd{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right));padding-block:14px 12px}
  .mapwrap{position:relative;height:38vh;height:38svh;border-left:none;border-block:1px solid var(--line);overscroll-behavior:contain}
  #map{touch-action:none}
  .mapwrap.collapsed{height:0;border:none}
  .main{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));padding-top:12px}
  .ftoggle,.maptoggle{display:inline-block}
  input,select,textarea{font-size:16px!important}
  .fab{all:unset;display:block;position:fixed;z-index:1400;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));cursor:pointer;background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
  html.mapfull .fab{display:none}
  .filters{padding:10px;gap:8px}
  .filters:not(.open) > .frow:not(:first-child){display:none}
  .flabel{min-width:100%;font-size:11px;margin-bottom:-3px}
  .chip{padding:4px 9px;font-size:12.5px}
  .hide-m{display:none}
  .show-m{display:block}
  .m-in{display:inline}
  table{table-layout:fixed}
  thead th:nth-child(1){width:62px}
  thead th:nth-child(4){width:92px}
  thead th:nth-child(5){width:84px}
  thead th:nth-child(2){width:calc(100vw - 24px - 240px)}
  .pill{white-space:normal;font-size:11.5px;padding:2px 7px}
  td{overflow-wrap:anywhere}
  table{font-size:13.5px}
  td{padding:8px 6px}
  th button,th.nosort{padding:9px 6px}
  .thumbs button{width:52px;height:52px}
  .thumbs button + button{display:none}
  .nophoto{width:52px;height:52px}
  .range input{width:110px}
  .lb-nav{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <header class="hd">
    <div class="toprow"><h1 data-t="title">Сауны Португалии</h1><div class="langsw" id="langsw" role="group" aria-label="Language"><button type="button" data-l="ru">RU</button><button type="button" data-l="en">EN</button><button type="button" data-l="pt">PT</button></div></div>
    <p data-t="intro"></p>
    <div class="stats" id="stats"></div>
    <div class="legend" id="legend"></div>
  </header>
  <div class="mapwrap" id="mapwrap"><div id="map" role="region" data-ta="mapaz"></div><button type="button" class="mapfull-x" id="mapfull-x" data-t="list">Список</button></div>
  <button type="button" class="fab" id="fab" data-t="fullmap">Карта на весь экран</button>
  <main class="main">
    <section class="filters" data-ta="filters">
      <div class="frow">
        <input id="q" class="search" type="search" data-tp="search">
        <button class="chip ftoggle" id="ftoggle" type="button" aria-expanded="false" data-t="filters">Фильтры</button>
      </div>
      <div class="frow"><span class="flabel" data-t="where">Где</span><div class="frow" id="f-scope"></div></div>
      <div class="frow"><span class="flabel" data-t="area">Район</span><div class="frow" id="f-area"></div></div>
      <div class="frow"><span class="flabel" data-t="type">Тип</span><div class="frow" id="f-kind"></div></div>
      <div class="frow"><span class="flabel" data-t="access">Доступ</span><div class="frow" id="f-access"></div></div>
      <div class="frow"><span class="flabel" data-t="has">Есть</span><div class="frow" id="f-ext"></div></div>
      <div class="frow"><span class="flabel" data-t="rating">Рейтинг</span><div class="frow" id="f-rate"></div></div>
      <div class="frow"><span class="flabel" data-t="hours">Часы</span><div class="frow" id="f-hours"></div></div>
      <div class="frow">
        <span class="flabel" data-t="price">Цена</span>
        <label class="range" for="price"><span data-t="daymax">разовый вход до</span> <input id="price" type="range" min="0" max="100" step="5" value="100"><output id="priceout" data-t="anyf">любая</output></label>
        <label class="range" for="mprice"><span data-t="memmax">абонемент до</span> <input id="mprice" type="range" min="0" max="300" step="10" value="300"><output id="mpriceout" data-t="anym">любой</output></label>
      </div>
      <div class="frow">
        <label class="range" for="sort"><span data-t="sort">Сортировка</span>
          <select id="sort">

function dayTxt(p){const a=p.access||{};
  if(p.status==="soon") return t("soon");
  if(p.status==="closed") return t("closed");
  if(p.stay && a.day_pass_price_eur==null && !p._trt) return t("guests");
  if(a.day_pass_price_eur!=null) return `${eur(a.day_pass_price_eur)}${a.session_minutes?" "+t("for_min",a.session_minutes):""}`;
  if(p._day) return t("yes_noprice");
  if(p._trt) return t("only_trt");
  if(p._mem&&a.day_pass!==true) return t("only_mem");
  if(a.day_pass===false) return t("no");
  return "";
}
function memTxt(p){const a=p.access||{}; if(a.membership_month_eur!=null) return t("per_month",eur(a.membership_month_eur)); if(p._mem) return t("mem_req"); if(a.membership===false) return t("no"); return null;}
function popup(p){const a=p.access||{}; const k=KINDS[p.kind]||KINDS.sauna; const r=p.ratings||{};
  const ph=p._ph.slice(0,8).map((x,j)=>`<button type="button" data-i="${p._i}" data-ph="${j}" aria-label="${esc(t("openphoto"))}"><img src="${esc(x.u)}" alt="" loading="lazy" referrerpolicy="no-referrer"></button>`).join("");

}

const NA = ``;

  if(p.status==="closed") return `<span class="pill p-no">${esc(t("closed"))}</span>`;
  if(p.stay && a.day_pass_price_eur==null && !p._trt) return `<span class="pill p-na">${esc(t("guests"))}</span>`;
  if(a.day_pass_price_eur!=null) return `<span class="price num">${eur(a.day_pass_price_eur)}</span>${w}${a.session_minutes?`<div class="sub num">${t("min",a.session_minutes)}</div>`:""}`;
  if(p._day) return `<span class="pill p-ok">${esc(t("yes"))}</span>${w}<div class="sub">${esc(t("noprice"))}</div>`;
  if(p._trt) return `<span class="pill p-warn">${esc(t("w_trt"))}</span>${w}`;
  if(p._mem&&a.day_pass!==true) return `<span class="pill p-na">${esc(t("w_mem"))}</span>${w}`;
  if(a.day_pass===false) return `<span class="pill p-no">${esc(t("no"))}</span>`;
  return w;
}
const sessCell = a => a.session_minutes?`<span class="num">${t("min",a.session_minutes)}</span>`:NA;
function memCell(p){const a=p.access||{}; if(a.membership_month_eur!=null) return `<span class="num">${eur(a.membership_month_eur)}</span><span class="dim">${t("per_mo")}</span>`; if(p._mem) return `<span class="dim">${esc(t("onreq"))}</span>`; if(a.membership===false) return `<span class="dim">${esc(t("no"))}</span>`; return NA;}
const bookCell = (a,p) => {const b=BOOK[a.booking]; return (b?`<span class="pill ${b[1]}">${b[0]}</span>`:"")+(p?bookBtn(p):"");};
function rateCell(r){ const h=rb(r); return h?`<div class="rbs">${h}</div>`:""; }
const kindCell = p => {const k=KINDS[p.kind]||KINDS.sauna; return `<span class="kind"><span class="dot" style="background:${k[1]}"></span>${esc(k[0])}</span>${p.beach?`<div class="sub">${esc(t("beach"))}</div>`:""}`;};

function detail(p){const a=p.access||{};
  const link=(u,t)=>{const s=safeUrl(u)||(/^http:\/\//i.test(u||"")?u:null); return s?`<a href="${esc(s)}" target="_blank" rel="noopener">${esc(t)}</a>`:"";};
  const maps=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+" "+(p.address||""))}${p.pid?"&query_place_id="+encodeURIComponent(p.pid):""}`;
  const it=[]; const add=(k,v)=>{ if(v) it.push(`<div><dt>${k}</dt><dd>${v}</dd></div>`); };
  add(t("d_type"), kindCell(p));
  add(t("d_addr"), `${esc(p.address||"")} ${link(maps,t("d_gmaps"))}`);
  add(t("d_has"), esc(amen(p).join(", ")));
  add(t("d_day"), esc([cap(dayTxt(p)), cap(tr(p,"day_note")||"")].filter(Boolean).join(". ")));
  add(t("d_mem"), esc([cap(memTxt(p)||""), cap(tr(p,"mem_note")||"")].filter(Boolean).join(". ")));
  add(t("d_book"), [BOOK[a.booking]?esc(BOOK[a.booking][0]):"", tr(p,"booking_how")?esc(t("d_via",tr(p,"booking_how"))):"", link(a.booking_url||p.booking_url,t("d_bookpage"))].filter(Boolean).join(", "));
  add(t("d_hours"), p.wk?(()=>{const s=openState(p.wk); return (s?`<div class="os ${s.open?"o":"c"}">${esc(s.txt)}</div>`:"")+weekTable(p.wk);})():esc(tr(p,"hours_text")||""));
  add(t("d_phone"), p.phone?`<span style="user-select:all">${esc(p.phone)}</span>`:"");
  add(t("d_site"), link(p.website,t("d_official")));
  const ig=(p.instagram||"").replace(/^@/,"").replace(/^https?:\/\/(www\.)?instagram\.com\//,"").replace(/\/.*$/,"");
  const tg=(p.telegram||"").replace(/^@/,"").replace(/^https?:\/\/t\.me\/(s\/)?/,"").replace(/\/.*$/,"");
  add(t("d_social"), [ig?link("https://www.instagram.com/"+ig+"/","Instagram @"+ig):"", tg?link("https://t.me/"+tg,"Telegram @"+tg):""].filter(Boolean).join(", "));
  add(t("d_rate"), (p.ratings&&(p.ratings.google||p.ratings.booking))?`${rb(p.ratings,true)}<div class="sub">${[p.ratings.google?"Google"+(p.ratings.google_reviews?`, ${nfmt(p.ratings.google_reviews)} ${t("d_ratings")}`:""):"",p.ratings.booking?"Booking"+(p.ratings.booking_reviews?`, ${nfmt(p.ratings.booking_reviews)} ${t("d_ratings")}`:""):""].filter(Boolean).join("; ")}</div>`:"");
  if(LANG==="ru") add(t("d_lists"), esc((p.lists||[]).join(", ")));
  add(t("d_sea"), p.sea_distance_m!=null?`≈ ${p.sea_distance_m>=1000?dec(Math.round(p.sea_distance_m/100)/10)+" "+t("km"):p.sea_distance_m+" "+t("m")}`:"");
  add(t("d_cascais"), p._d<900?`≈ ${kmTxt(p._d)} ${t("km")}, ${t("straight")}`:"");
  add(t("d_rules"), esc([p.min_age?t("from_age",p.min_age):"", cap(tr(p,"rules")||"")].filter(Boolean).join(". ")));
  const src=(p.sources||[]).map(u=>safeUrl(u)||(/^http:\/\//.test(u)?u:null)).filter(Boolean).slice(0,4).map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener">${i+1}</a>`).join(" ");
  const gal=p._ph.length?`<div class="gallery">${p._ph.map((x,j)=>`<button type="button" data-i="${p._i}" data-ph="${j}" aria-label="${esc(t("photo_n",j+1))}"><img src="${esc(x.t||x.u)}" alt="" loading="lazy" referrerpolicy="no-referrer"></button>`).join("")}</div>`:"";
  const conf=p.confidence?t("conf_"+p.confidence):"";
  const dest=p.lat!=null?`${p.lat},${p.lon}`:"";
  const bu=bookUrl(p);
  const acts=`<div class="acts">${bu?`<a class="act prim" href="${esc(bu)}" target="_blank" rel="noopener">${esc(t("book"))}</a>`:""}<button type="button" class="act" data-showmap="${p._i}">${esc(t("showmap"))}</button>${dest?`<a class="act" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${dest}${p.pid?"&destination_place_id="+encodeURIComponent(p.pid):""}">${esc(t("r_google"))}</a><a class="act" target="_blank" rel="noopener" href="https://maps.apple.com/?daddr=${dest}&q=${encodeURIComponent(p.name)}">${esc(t("r_apple"))}</a><a class="act" target="_blank" rel="noopener" href="https://waze.com/ul?ll=${dest}&navigate=yes">Waze</a>`:""}<button type="button" class="act" data-share="${p._i}">${esc(t("copylink"))}</button></div>`;
  return `${acts}${gal}<dl class="dgrid">${it.join("")}</dl>${tr(p,"notes")?`<p class="note">${esc(tr(p,"notes"))}</p>`:""}<div class="src">${esc(t("checked",p.verified_on||""))}${conf?`, ${esc(t("reliab",conf))}`:""}${src?`. ${t("sources")}: ${src}`:""}</div>`;
}

function filtered(){
  const minR=+st.rate;
  return P.filter(p=>{const a=p.access||{};
    if(st.q && !(`${p.name} ${p.subtitle||""} ${p.address||""} ${AREA_RU[p.area]||""} ${areaName(p.area)} ${p.area||""}`.toLowerCase().includes(st.q))) return false;
    if(st.hrs.size){ const w=p.wk; if(!w) return false; const S=openState(w);
      if(st.hrs.has("now") && !(S&&S.open)) return false;
      if(st.hrs.has("eve") && !w.some(x=>Array.isArray(x)&&x[1]>=21*60+1)) return false;
      if(st.hrs.has("wknd") && !(Array.isArray(w[5])||Array.isArray(w[6]))) return false;
      if(st.hrs.has("early") && !w.some(x=>Array.isArray(x)&&x[0]<=8*60)) return false; }
    if(st.scope==="near" && !p._near) return false;
    if(st.area.size && !st.area.has(p.area)) return false;
    if(st.kind.size && !st.kind.has(p.kind)) return false;
    if(st.access.has("day") && !p._day) return false;
    if(st.access.has("membership") && !p._mem) return false;
    if(st.access.has("treatment") && !p._trt) return false;
    if(st.access.has("walkin") && a.booking!=="walk_in") return false;
    if(st.ext.has("pool") && !p._pool) return false;
    if(st.ext.has("cold") && !p._cold) return false;
    if(st.ext.has("hammam") && !p._ham) return false;
    if(st.ext.has("sea") && !p._sea) return false;
    if(st.ext.has("photo") && !p._ph.length) return false;
    if(minR && !(p._g>=minR)) return false;
    if(st.price!=null && (a.day_pass_price_eur==null || a.day_pass_price_eur>st.price)) return false;
    if(st.mprice!=null && (a.membership_month_eur==null || a.membership_month_eur>st.mprice)) return false;
    return true;
  }).sort((x,y)=>{const ax=x.access||{}, ay=y.access||{}, d=st.dir; const nl=(u,v)=> (u==null&&v==null)?0:u==null?1:v==null?-1:d*(u-v);
    switch(st.sort){
      case "price": return nl(ax.day_pass_price_eur,ay.day_pass_price_eur)||x._d-y._d;
      case "mprice": return nl(ax.membership_month_eur,ay.membership_month_eur)||x._d-y._d;
      case "session": return nl(ax.session_minutes,ay.session_minutes)||x._d-y._d;
      case "book": return d*(x._book-y._book)||x._d-y._d;
      case "kind": return d*((KINDS[x.kind]||[""])[0].localeCompare((KINDS[y.kind]||[""])[0]))||x._d-y._d;
      case "dist": return d*(x._d-y._d);
      case "sea": return nl(x.sea_distance_m,y.sea_distance_m);
      case "name": return d*x.name.localeCompare(y.name);
      default: return d*(x._score-y._score)||((y.ratings?.google_reviews||0)-(x.ratings?.google_reviews||0));
    }
  });
}

const tbody=document.getElementById("tbody");
let lastAreaKey="";
function render(){
  renderHead();
  const list=filtered(); const vis=new Set(list.map(p=>p._i));
  Object.entries(markers).forEach(([i,m])=>{ const on=vis.has(+i); if(on&&!cluster.hasLayer(m)) cluster.addLayer(m); if(!on&&cluster.hasLayer(m)) cluster.removeLayer(m); });
  const ak=st.scope+"|"+[...st.area].sort().join(","); if(ak!==lastAreaKey){ lastAreaKey=ak; const pts=list.filter(p=>p.lat!=null).map(p=>[p.lat,p.lon]); if(st.area.size&&pts.length) map.fitBounds(pts,{padding:[30,30],maxZoom:14}); else fitDefault(); }
  document.getElementById("empty").hidden = list.length>0;
  tbody.innerHTML = list.map(p=>{const a=p.access||{};
    const am=amen(p);
    const k=KINDS[p.kind]||KINDS.sauna; const open=st.open===p._i;
    const row=`<tr class="row${open?" active":""}" data-i="${p._i}" tabindex="0" aria-expanded="${open}">
      <td>${photoCell(p)}</td>
      <td><div class="name">${esc(p.name)}</div>${tr(p,"subtitle")?`<div class="sub">${esc(tr(p,"subtitle"))}</div>`:""}<div class="sub"><span class="m-in"><span class="dot" style="background:${k[1]}"></span></span>${esc(areaName(p.area)||"")}${p._d<900?` · ${kmTxt(p._d)} ${t("km")}`:""}<span class="m-in"> · ${esc(k[0])}</span></div>${am.length?`<div class="am">${am.map(esc).join(" · ")}</div>`:""}</td>
      <td class="hide-m hide-l">${kindCell(p)}</td>
      <td>${dayCell(p)}</td>
      <td>${bookCell(a,p)}</td>
      <td class="hide-m">${memCell(p)}</td>
      <td class="hide-m hrs">${hoursCell(p)}</td>
      <td class="hide-m">${rateCell(p.ratings)}</td>
</tr>`;
    return row+(open?`<tr class="detail"><td colspan="${COLS.length}">${mobileExtra(p)}${detail(p)}</td></tr>`:"");}).join("");
  const n=list.length, nd=list.filter(p=>(p.access||{}).day_pass_price_eur!=null).length, nm=list.filter(p=>(p.access||{}).membership_month_eur!=null).length;
  document.getElementById("stats").innerHTML=`<span><b>${n}</b> ${t("of")} ${P.length} ${t("places")}</span><span><b>${nd}</b> ${t("withday")}</span><span><b>${nm}</b> ${t("withmem")}</span>`;
  const nf=st.area.size+st.kind.size+st.access.size+st.ext.size+st.hrs.size+(st.rate!=="0"?1:0)+(st.price!=null?1:0)+(st.mprice!=null?1:0);
  ft.textContent = nf?t("filt_n",nf):t("filters");
}
function mobileExtra(p){ if(!matchMedia("(max-width:900px)").matches) return ""; const a=p.access||{};
  const parts=[]; const mc=memCell(p); if(mc) parts.push(`<span><span class="dim">${t("mx_mem")}</span> ${mc}</span>`); const hc=hoursCell(p); if(hc) parts.push(`<span><span class="dim">${t("mx_hours")}</span> ${hc}</span>`);
  return parts.length?`<div class="frow" style="margin-bottom:10px;gap:6px 14px;font-size:13px">${parts.join("")}</div>`:""; }
const isPhone=()=>matchMedia("(max-width:900px)").matches;
function openRow(i,fromMap){
  const before=tbody.querySelector(`tr.row[data-i="${i}"]`); const y0=before?before.getBoundingClientRect().top:null;
  st.open = (st.open===i && !fromMap) ? null : i; render();
  document.querySelectorAll(".mk.active").forEach(e=>e.classList.remove("active"));
  const r=tbody.querySelector(`tr.row[data-i="${i}"]`);
  if(fromMap){ if(document.documentElement.classList.contains("mapfull")) closeFull(); map.closePopup(); r&&r.scrollIntoView({block:"start",behavior:"smooth"}); }
  else if(r&&y0!=null){ window.scrollBy(0, r.getBoundingClientRect().top-y0); }
  if(st.open==null) return;
  const el=document.querySelector(`.mk[data-i="${i}"]`); if(el) el.classList.add("active");
  try{ history.replaceState(null,"","#p-"+P[i].id); }catch(e){}
  if(!fromMap && !isPhone() && markers[i]){ cluster.zoomToShowLayer(markers[i],()=>markers[i].openPopup()); }
}
function showOnMap(i){ if(isPhone()) openFull(); setTimeout(()=>{ map.invalidateSize(); if(markers[i]) cluster.zoomToShowLayer(markers[i],()=>markers[i].openPopup()); },80); }
const fab=document.getElementById("fab");
function openFull(){ document.documentElement.classList.add("mapfull"); try{history.pushState({mapfull:1},"");}catch(e){} setTimeout(()=>map.invalidateSize(),60); }
function closeFull(fromPop){ if(!document.documentElement.classList.contains("mapfull")) return; document.documentElement.classList.remove("mapfull"); setTimeout(()=>map.invalidateSize(),60); if(!fromPop){ try{ if(history.state&&history.state.mapfull) history.back(); }catch(e){} } }
fab.onclick=openFull; document.getElementById("mapfull-x").onclick=()=>closeFull();
window.addEventListener("popstate",()=>closeFull(true));
// near me
let ME=null;
document.getElementById("near").onclick=()=>{ const b=document.getElementById("near");
  if(!navigator.geolocation){ b.textContent=t("geo_na"); return; }
  b.textContent=t("geo_wait");
  navigator.geolocation.getCurrentPosition(pos=>{ ME=[pos.coords.latitude,pos.coords.longitude]; P.forEach(p=>{ if(p.lat!=null) p._d=km(ME,[p.lat,p.lon]); }); b.textContent=t("geo_ok"); setSort("dist",1); L.circleMarker(ME,{radius:7,color:"#fff",weight:2,fillColor:"#2f6fb2",fillOpacity:1}).addTo(map); map.setView(ME,12); },
    ()=>{ b.textContent=t("geo_no"); }, {enableHighAccuracy:false,timeout:10000,maximumAge:600000}); };
tbody.addEventListener("click",e=>{ const ph=e.target.closest("[data-ph]"); if(ph){ e.stopPropagation(); openLB(+ph.dataset.i,+ph.dataset.ph); return; }
  const sm=e.target.closest("[data-showmap]"); if(sm){ showOnMap(+sm.dataset.showmap); return; }
  const sh=e.target.closest("[data-share]"); if(sh){ const u=location.origin+location.pathname+"#p-"+P[+sh.dataset.share].id; const done=()=>{sh.textContent=t("copied");}; (navigator.clipboard?navigator.clipboard.writeText(u).then(done,()=>{prompt("Link",u)}):prompt("Link",u)); return; }
  const r=e.target.closest("tr.row"); if(r && !e.target.closest("a")) openRow(+r.dataset.i,false);});
tbody.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&e.target.matches("tr.row")){ e.preventDefault(); openRow(+e.target.dataset.i,false);} });

// lightbox
const lb=document.getElementById("lb"); const lbImg=document.createElement("img"); lbImg.alt=""; document.getElementById("lb-imgslot").appendChild(lbImg);
let lbP=null, lbJ=0, lastFocus=null;
function lbShow(){ const x=lbP._ph[lbJ]; lbImg.src=x.u; lbImg.alt=lbP.name;
  document.getElementById("lb-title").textContent=lbP.name;
  document.getElementById("lb-count").textContent=t("n_of",lbJ+1,lbP._ph.length);
  const s=document.getElementById("lb-src"); const su=safeUrl(x.s)||(/^http:\/\//.test(x.s||"")?x.s:null); s.hidden=!su; if(su) s.href=su;
  const many=lbP._ph.length>1; document.getElementById("lb-prev").hidden=!many; document.getElementById("lb-next").hidden=!many;
  const nx=lbP._ph[(lbJ+1)%lbP._ph.length]; if(nx){ const im=new Image(); im.referrerPolicy="no-referrer"; im.src=nx.u; } }
function openLB(i,j){ lbP=P[i]; if(!lbP||!lbP._ph.length) return; lbJ=j||0; lastFocus=document.activeElement; lb.hidden=false; document.body.style.overflow="hidden"; lbShow(); document.getElementById("lb-x").focus(); }
function closeLB(){ lb.hidden=true; document.body.style.overflow=""; lbImg.removeAttribute("src"); lastFocus&&lastFocus.focus&&lastFocus.focus(); }
const step=d=>{ if(!lbP) return; lbJ=(lbJ+d+lbP._ph.length)%lbP._ph.length; lbShow(); };
lbImg.referrerPolicy="no-referrer";
document.getElementById("lb-x").onclick=closeLB;
document.getElementById("lb-prev").onclick=()=>step(-1);
document.getElementById("lb-next").onclick=()=>step(1);
document.getElementById("lb-stage").addEventListener("click",e=>{ if(e.target.id==="lb-stage") closeLB(); });
document.addEventListener("keydown",e=>{ if(lb.hidden) return; if(e.key==="Escape") closeLB(); if(e.key==="ArrowLeft") step(-1); if(e.key==="ArrowRight") step(1); });
let tx=null, ty=null;
lb.addEventListener("touchstart",e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; },{passive:true});
lb.addEventListener("touchend",e=>{ if(tx==null) return; const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty; if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)) step(dx<0?1:-1); else if(dy>90) closeLB(); tx=null; },{passive:true});
lbImg.onerror=()=>{ if(lbP && lbP._ph.length>1){ lbP._ph.splice(lbJ,1); if(lbJ>=lbP._ph.length) lbJ=0; lbShow(); } };
document.addEventListener("error",e=>{ const t=e.target; if(t && t.tagName==="IMG" && t.closest("[data-ph]")){ const b=t.closest("[data-ph]"); b.style.display="none"; } },true);

render();
(function(){ const h=decodeURIComponent(location.hash||""); const mm=h.match(/^#p-(.+)$/); if(!mm) return; const p=P.find(x=>x.id===mm[1]); if(!p) return;
  if(!p._near){ st.scope="all"; document.querySelectorAll("#f-scope .chip").forEach(c=>c.setAttribute("aria-pressed",String(c.dataset.k==="all"))); drawAreas(); }
  openRow(p._i,false); const r=tbody.querySelector(`tr.row[data-i="${p._i}"]`); r&&r.scrollIntoView({block:"start"}); if(markers[p._i]) cluster.zoomToShowLayer(markers[p._i],()=>{}); })();
const m=D.meta||{};
const drawFoot=()=>{ document.getElementById("foot").textContent = t("foot",t("updated")); }; drawFoot();
})();
