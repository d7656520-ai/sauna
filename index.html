/* Layout: split screen. Left: header, filters, sortable table. Right: sticky map. Phone: header, map, filters (collapsible), compact rows. */
:root{
  --bg:#f4f6f5; --panel:#ffffff; --ink:#18201d; --muted:#5d6a65; --line:#dde3e0;
  --sea:#0f6b72; --sea-soft:#e2f0f0; --heat:#c26a12; --heat-soft:#fbefdf;
  --ok:#276b43; --ok-soft:#e3f2e8; --warn:#7a5400; --warn-soft:#fbf1d6; --no:#a23a3a; --no-soft:#f7e3e3;
  --on-sea:#fff; --heat-text:#9a5410;
  --chip:#eef2f0; --scrim:rgba(8,14,12,.985); --tilefilter:none;
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1513; --panel:#161e1b; --ink:#e6ece9; --muted:#97a6a0; --line:#26322e;
  --sea:#5cc0c6; --sea-soft:#15302f; --heat:#f0a24a; --heat-soft:#3a2810;
  --ok:#6fcf93; --ok-soft:#173326; --warn:#e5bf55; --warn-soft:#3a3010; --no:#ef8a8a; --no-soft:#3d1c1c;
  --chip:#1d2723; --scrim:rgba(0,0,0,.99);
  --on-sea:#0f1513; --heat-text:#f0a24a;
  --tilefilter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.6);
  color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
html{overscroll-behavior-y:none}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--sea)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(0,58fr) minmax(360px,42fr);grid-template-rows:auto 1fr;min-height:100%}
.hd{grid-column:1;grid-row:1;min-width:0;padding-block:20px 0;padding-left:max(20px,env(safe-area-inset-left));padding-right:20px}
.main{grid-column:1;grid-row:2;min-width:0;padding-block:0 40px;padding-left:max(20px,env(safe-area-inset-left));padding-right:20px}
.mapwrap{grid-column:2;grid-row:1 / span 2;align-self:start;position:sticky;top:0;height:100vh;border-left:1px solid var(--line)}
#map{position:absolute;inset:0;background:var(--chip)}
.leaflet-tile-pane{filter:var(--tilefilter)}
.hd h1{font:700 clamp(22px,3vw,30px)/1.1 var(--f-display);letter-spacing:-.01em;margin:0 0 6px;text-wrap:balance}
.hd p{margin:0;color:var(--muted);max-width:66ch}
.stats{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0 2px;color:var(--muted);font-size:13px}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.fwrap{display:grid;gap:10px;margin:16px 0;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px}

.mapbtn{display:none}
.frow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}

.chip[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--on-sea)}
.chip[aria-expanded="true"]{background:var(--sea-soft);border-color:var(--sea);color:var(--sea)}
.chip:hover{border-color:var(--sea)}

.fhead .reset[hidden]{display:none}
/* region filter: collapsed <details> at the bottom */
.fd{display:block}

th[aria-sort="descending"] button::after{border-top-color:currentColor;border-bottom-width:0}

.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.name{font-weight:600}
.wtag{display:inline-block;margin-left:6px;font-size:11px;font-weight:500;padding:0 6px;border:1px dashed var(--warn);color:var(--warn);border-radius:6px;vertical-align:1px;white-space:nowrap}

@media (min-width:901px) and (max-width:2099px){.hide-l{display:none!important} .m-in{display:inline!important}}
@media (min-width:901px) and (max-width:1399px){#tbody td.nm{min-width:140px!important}}
@media (min-width:901px){#tbody td.nm{min-width:165px} table{font-size:13.5px} td{padding:8px 7px} th button,th.nosort{padding:9px 7px} .filters:not(.open) > .more{display:none} .m-only{display:none!important}}

function filtered(){

function placePop(btn){ hpop.hidden=false; if(isPhone()){ hpop.style.left=""; hpop.style.top=""; return; } const r=btn.getBoundingClientRect(); const w=hpop.offsetWidth, h=hpop.offsetHeight; let x=Math.min(r.left, innerWidth-w-10); let y=r.bottom+6; if(y+h>innerHeight-10) y=Math.max(10,r.top-h-6); hpop.style.left=Math.max(10,x)+"px"; hpop.style.top=y+"px"; }
function popShow(btn,html,o){ o=o||{}; popOpener=btn; hpop.classList.toggle("wide",!!o.wide); hpop.dataset.keep=o.keep?"1":"";
  hpop.innerHTML=`<button type="button" class="hpop-x" aria-label="${esc(t("close"))}">×</button>`+html; hpop.setAttribute("aria-label",o.label||""); placePop(btn); }
function closePop(refocus){ if(hpop.hidden) return; hpop.hidden=true; hpop.dataset.for=""; if(refocus&&popOpener&&popOpener.focus) popOpener.focus(); }
hpop.addEventListener("click",e=>{ if(e.target.closest(".hpop-x")) closePop(true); });
function showSched(btn){ const p=P[+btn.dataset.sch]; const c=p&&p.sch; if(!c) return; const dk=["mon","tue","wed","thu","fri","sat","sun"];
  const wk=c.week||c.windows; let grid="";
  if(wk){ grid=`<div class="sgrid">${dk.map((k,i)=>wk[k]&&wk[k].length?`<span>${DN()[i]}</span><span class="tm">${wk[k].map(x=>`<i>${esc(String(x).replace("-"," "+t("to")+" "))}</i>`).join("")}</span>`:"").join("")}</div>`; if(c.windows&&!c.week) grid=`<div class="sup">${esc(t("sch_win"))}</div>`+grid; }
  const fm=(c.formats||[]).map(f=>`<div><span>${esc(f["name_"+LANG]||f.name_en||f.name_ru||"")}${f.minutes?" · "+fmtMinU(f.minutes):""}</span><b class="num">${f.price_eur!=null?eur(f.price_eur):""}</b></div>`).join("");
  const up=(c.upcoming||[]).slice(0,5).map(u=>{ const d=new Date(u.date+"T12:00:00"); const ds=d.toLocaleDateString(LANG==="pt"?"pt-PT":LANG==="en"?"en-GB":"ru-RU",{day:"numeric",month:"short",weekday:"short"}); return `<div><b>${esc(ds)}${u.time?" "+esc(u.time):""}</b> ${esc(u.title||"")}</div>`; }).join("");
  const bu=safeUrl(c.booking_url)||bookUrl(p);
  popShow(btn,`<div class="hpt">${esc(t("sch_t"))} · ${esc(p.name)}</div>${c["summary_"+LANG]||c.summary_en?`<div style="font-size:12.5px">${esc(c["summary_"+LANG]||c.summary_en)}</div>`:""}${grid}${fm?`<div class="sfm">${fm}</div>`:""}${up?`<div class="sup">${esc(t("sch_up"))}:${up}</div>`:""}${bu?`<a class="bookb" href="${esc(bu)}" target="_blank" rel="noopener" style="margin-top:8px">${esc(t("book"))}</a>`:""}`,{wide:true,label:t("sch_t")+" · "+p.name}); }
function showHours(btn){ const p=P[+btn.dataset.hrs]; if(!p||!p.wk) return; useNow(p); popShow(btn,`<div class="hpt">${esc(t("weekhrs"))}</div>${statusLine(p)}${weekTable(p.wk)}`,{label:t("weekhrs")+" · "+p.name}); }
document.addEventListener("click",e=>{ const b=e.target.closest&&e.target.closest(".hbtn"); if(b){ e.stopPropagation(); e.preventDefault(); const key=b.dataset.hrs||('s'+b.dataset.sch); if(!hpop.hidden&&hpop.dataset.for===key){ closePop(); return; } if(b.dataset.sch!=null) showSched(b); else showHours(b); hpop.dataset.for=key; return; } if(!e.target.closest||(!e.target.closest("#hpop")&&!e.target.closest("[data-fb]"))) closePop(); },true);
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!hpop.hidden) closePop(true); });
window.addEventListener("scroll",()=>{ if(hpop.dataset.keep!=="1") closePop(); },{passive:true});
map.on("movestart",()=>{ if(hpop.dataset.keep!=="1") closePop(); });
// owner / visitor feedback (shown only when FB is configured)
const fbDone=(p,k)=>!!lsGet(`fb:${p.id}:${k}`);
function fbCid(){ let c=lsGet("sauna-cid"); if(!c){ c=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36); lsSet("sauna-cid",c); } return c; }
function fbVals(p,data){ return {place_id:p.id,kind:data.kind,problem:data.problem||"",rating:data.rating!=null?String(data.rating):"",comment:String(data.comment||"").slice(0,300),cid:fbCid(),lang:LANG}; }
function fbSend(p,data){ if(!FB.B) return Promise.resolve(false); const v=fbVals(p,data);
  return fetch(FB.API+"/api/feedback",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(v)}).then(r=>r.ok?r.json():Promise.reject(r.status)).then(j=>{ if(!j.ok) throw 0; lsSet(`fb:${p.id}:${data.kind}`,String(Date.now())); fbMark(p,data.kind); return true; }).catch(()=>{ fbFail(p,data.kind); return false; }); }
function fbFail(p,k){ document.querySelectorAll(`.fbb[data-fb="${k}"][data-i="${p._i}"]`).forEach(b=>{ const o=b.textContent; b.textContent=t("fb_err"); setTimeout(()=>{ b.textContent=o; },2500); }); }
function fbFormUrl(p,data){ return ""; }
function ownerUrl(p){ const q=new URLSearchParams({id:p.id,name:p.name,lang:LANG}); return "owner.html?"+q.toString(); }
const fbThx=k=>t(k==="problem"?"fb_thanks":"fb_thx");
function fbBtn(p,k,lab){ return fbDone(p,k)?`<button type="button" class="fbb" aria-disabled="true" disabled>${esc(fbThx(k))}</button>`:`<button type="button" class="fbb" data-fb="${k}" data-i="${p._i}"${k==="ok"?"":` aria-haspopup="dialog"`}>${esc(lab)}</button>`; }
function fbLine(p){ if(!FB.B&&!FB.A) return ""; const o=[];
  if(FB.B) o.push(`<span>${esc(t("fb_q"))}</span>`, fbBtn(p,"ok",t("fb_ok")), fbBtn(p,"problem",t("fb_flag")), fbBtn(p,"rating",t("fb_rate")));
  if(FB.A) o.push(`${FB.B?`<span class="sep" aria-hidden="true">·</span>`:""}<a class="fbo" href="${esc(ownerUrl(p))}" target="_blank" rel="noopener" title="${esc(t("fb_own_h"))}">${esc(t("fb_own"))} →</a>`);
  return `<div class="fbl">${o.join("")}</div>`; }
function fbMark(p,k){ document.querySelectorAll(`.fbb[data-fb="${k}"][data-i="${p._i}"]`).forEach(b=>{ b.removeAttribute("data-fb"); b.disabled=true; b.setAttribute("aria-disabled","true"); b.textContent=fbThx(k); }); }
function fbClick(btn){ const p=P[+btn.dataset.i]; const k=btn.dataset.fb; if(!p||fbDone(p,k)) return;
  if(k==="ok"){ fbSend(p,{kind:"ok"}); return; }
  const key="fb"+k+p._i; if(!hpop.hidden&&hpop.dataset.for===key){ closePop(); return; }
  if(k==="problem"){
    popShow(btn,`<div class="hpt">${esc(t("fb_flag").replace(/^\S+\s/,""))} · ${esc(pname(p))}</div><form class="fbf" data-i="${p._i}">${["closed","hours","price","nosauna","other"].map(c=>`<label><input type="radio" name="fbp" value="${c}"> ${esc(t("fb_p_"+c))}</label>`).join("")}<textarea name="c" maxlength="300" rows="2" placeholder="${esc(t("fb_comment"))}" aria-label="${esc(t("fb_comment"))}"></textarea><button type="submit" class="fbsend" disabled>${esc(t("fb_send"))}</button></form>`,{keep:true,label:t("fb_flag")+" · "+pname(p)});
    const f=hpop.querySelector("form"); f.addEventListener("change",()=>{ f.querySelector(".fbsend").disabled=!f.querySelector("input[name=fbp]:checked"); });
    f.addEventListener("submit",ev=>{ ev.preventDefault(); const c=f.querySelector("input[name=fbp]:checked"); if(!c) return; fbSend(p,{kind:"problem",problem:c.value,comment:f.querySelector("textarea").value}); closePop(true); });
    const r0=f.querySelector("input"); if(r0) r0.focus({preventScroll:true});
  } else {
    popShow(btn,`<div class="hpt">${esc(t("fb_rate").replace(/^\S+\s/,""))} · ${esc(pname(p))}</div><div class="fbstars" role="group" aria-label="${esc(t("fb_rate"))}">${[1,2,3,4,5].map(n=>`<button type="button" data-star="${n}" aria-label="${esc(t("fb_star_n",n))}">★</button>`).join("")}</div>`,{keep:true,label:t("fb_rate")+" · "+pname(p)});
    const g=hpop.querySelector(".fbstars"); g.addEventListener("mouseover",e=>{ const b=e.target.closest("[data-star]"); const n=b?+b.dataset.star:0; g.querySelectorAll("button").forEach(x=>x.classList.toggle("on",+x.dataset.star<=n)); });
    g.addEventListener("click",e=>{ const b=e.target.closest("[data-star]"); if(!b) return; fbSend(p,{kind:"rating",rating:+b.dataset.star}); closePop(true); });
    const s0=g.querySelector("button"); if(s0) s0.focus({preventScroll:true});
  }
  hpop.dataset.for=key; }
// lightbox
// lightbox: a native scroll-snap track (one slide per viewport) so the photo follows the finger and settles on the next one;
// arrows, keys and the counter drive/follow the same scroll position
const lb=document.getElementById("lb"); const lbTrack=document.getElementById("lb-track");
let lbP=null, lbJ=0, lastFocus=null, lbRaf=0;
function lbBuild(){ lbTrack.innerHTML=lbP._ph.map((x,j)=>`<div class="lb-slide" data-j="${j}"><img alt="" decoding="async" referrerpolicy="no-referrer" loading="${Math.abs(j-lbJ)<=1?"eager":"lazy"}" src="${esc(x.u)}" data-j="${j}"></div>`).join(""); }
function lbAlign(smooth){ lbTrack.scrollTo({left:lbJ*lbTrack.clientWidth,behavior:smooth?"smooth":"auto"}); }
function lbShow(){ const x=lbP._ph[lbJ]; if(!x) return;
  document.getElementById("lb-title").textContent=pname(lbP);
  document.getElementById("lb-count").textContent=t("n_of",lbJ+1,lbP._ph.length);
  const s=document.getElementById("lb-src"); const su=safeUrl(x.s)||(/^http:\/\//.test(x.s||"")?x.s:null); s.hidden=!su; if(su) s.href=su;
  const many=lbP._ph.length>1; ["lb-prev","lb-next"].forEach(id=>document.getElementById(id).hidden=!many);
  [lbJ,lbJ+1,lbJ-1].forEach(j=>{ const sl=lbTrack.children[(j+lbP._ph.length)%lbP._ph.length]; const im=sl&&sl.firstElementChild; if(im&&im.loading==="lazy") im.loading="eager"; }); }
function openLB(i,j){ lbP=P[i]; if(!lbP||!lbP._ph.length) return; lbJ=j||0; lastFocus=document.activeElement; lb.hidden=false; document.body.style.overflow="hidden"; lbBuild(); lbAlign(false); lbShow(); document.getElementById("lb-x").focus(); }
function closeLB(){ lb.hidden=true; document.body.style.overflow=""; lbTrack.innerHTML=""; lbP=null; lastFocus&&lastFocus.focus&&lastFocus.focus(); }
const step=d=>{ if(!lbP) return; lbJ=(lbJ+d+lbP._ph.length)%lbP._ph.length; lbAlign(true); lbShow(); };
lbTrack.addEventListener("scroll",()=>{ if(lbRaf||!lbP) return; lbRaf=requestAnimationFrame(()=>{ lbRaf=0; if(!lbP||!lbTrack.clientWidth) return; const j=Math.round(lbTrack.scrollLeft/lbTrack.clientWidth); if(j!==lbJ&&j>=0&&j<lbP._ph.length){ lbJ=j; lbShow(); } }); },{passive:true});
window.addEventListener("resize",()=>{ if(!lb.hidden&&lbP) lbAlign(false); });
document.getElementById("lb-x").onclick=closeLB;
document.getElementById("lb-prev").onclick=()=>step(-1);
document.getElementById("lb-next").onclick=()=>step(1);
// tap on the photo: left third = previous, right third = next; tap beside the photo closes
lbTrack.addEventListener("click",e=>{ if(e.target.tagName==="IMG"){ if(lbP&&lbP._ph.length>1){ const r=lbTrack.getBoundingClientRect(); const f=(e.clientX-r.left)/r.width; if(f<0.33) step(-1); else if(f>0.67) step(1); } return; } closeLB(); });
document.addEventListener("keydown",e=>{ if(lb.hidden) return; if(e.key==="Escape") closeLB(); if(e.key==="ArrowLeft") step(-1); if(e.key==="ArrowRight") step(1);
  if(e.key==="Tab"){ const f=["lb-x","lb-prev","lb-next","lb-src"].map(id=>document.getElementById(id)).filter(x=>x&&!x.hidden); if(!f.length) return; const k=f.indexOf(document.activeElement); e.preventDefault(); f[(k+(e.shiftKey?-1:1)+f.length)%f.length].focus(); } });
// horizontal swipes are native scroll; a clear vertical swipe down closes
let tx=null, ty=null;
lb.addEventListener("touchstart",e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; },{passive:true});
lb.addEventListener("touchend",e=>{ if(tx==null) return; const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty; if(dy>90&&Math.abs(dx)<40) closeLB(); tx=null; },{passive:true});
lbTrack.addEventListener("error",e=>{ const im=e.target; if(!lbP||!im||im.tagName!=="IMG") return; if(lbP._ph.length>1){ const j=+im.dataset.j; lbP._ph.splice(j,1); if(j<lbJ) lbJ--; if(lbJ>=lbP._ph.length) lbJ=0; lbBuild(); lbAlign(false); lbShow(); } },true);
document.addEventListener("error",e=>{ const t=e.target; if(t && t.tagName==="IMG" && t.dataset.full && t.getAttribute("src")!==t.dataset.full){ t.src=t.dataset.full; return; } if(t && t.tagName==="IMG" && t.closest("[data-ph]")){ const b=t.closest("[data-ph]"); b.style.display="none"; const nx=b.nextElementSibling; if(nx&&b.parentElement.classList.contains("thumbs")) nx.style.display="block"; } },true);

setInterval(()=>{ NOWC={}; if(hpop.hidden&&lb.hidden) render(true); },300000);
// own API: enable owner/feedback UI only when the service answers
(function(){ const ctl=new AbortController(); setTimeout(()=>ctl.abort(),6000);
  fetch(FB_API+"/api/health",{signal:ctl.signal}).then(r=>r.ok?r.json():null).then(j=>{ if(!j||!j.ok) return; FB.B="api"; FB.A="owner.html";
    return fetch(FB_API+"/api/stats").then(r=>r.ok?r.json():{}).then(sx=>{ P.forEach(p=>{ if(sx[p.id]) p.fb=sx[p.id]; }); }).catch(()=>{}).then(()=>{ if(hpop.hidden&&lb.hidden) render(true); }); }).catch(()=>{}); })();
renderHead(); render();
function openFromHash(){ const h=decodeURIComponent(location.hash||""); const mm=h.match(/^#p-(.+)$/); if(!mm) return; const p=P.find(x=>x.id===mm[1]||(x.alias_ids||[]).includes(mm[1])); if(!p) return;
  if(st.open!==p._i) openRow(p._i,false,true); scrollToRow(p._i); if(markers[p._i]) cluster.zoomToShowLayer(markers[p._i],()=>{}); }
openFromHash();
window.addEventListener("hashchange",openFromHash);
const drawFoot=()=>{ document.getElementById("foot").textContent = t("foot",t("updated")); }; drawFoot();
})();
</script>
